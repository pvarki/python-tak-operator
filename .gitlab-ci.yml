image: ghcr.io/astral-sh/uv:0.12.13-python3.14-trixie

check-project-setup:
  stage: .pre
  script:
    - |
      failed=0
      check_no_matches() {
        status=0
        git grep -n -I -E "$1" -- "$2" || status=$?
        case "$status" in
          0) echo "$3" >&2; failed=1 ;;
          1) ;;
          *) exit "$status" ;;
        esac
      }
      check_no_matches '[!]{4}' . 'Resolve and remove the template reminders shown above.'
      check_no_matches '^[[:space:]]*#[[:space:]]*(homepage|repository|license)[[:space:]]*=' \
        pyproject.toml 'Configure homepage, repository, and license instead of leaving commented placeholders.'
      exit "$failed"

test:
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  script:
    - uv sync --locked --python "$PYTHON_VERSION"
    - uv run --locked prek run --all-files
    - uv run --locked pytest --junitxml=pytest.xml tests/
    - uv build
  artifacts:
    when: always
    reports:
      junit: pytest.xml

production-build:
  image: docker:29.8.0-cli
  services:
    - name: docker:29.8.0-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    DOCKER_BUILDKIT: "1"
  parallel:
    matrix:
      - VARIANT: [alpine, debian]
  before_script:
    - docker info
  script:
    - >-
      docker build
      --add-host=host.docker.internal:host-gateway
      --progress=plain
      --target production
      --file "Dockerfile_${VARIANT}"
      --tag "production-check:${CI_COMMIT_SHA}-${VARIANT}"
      .
