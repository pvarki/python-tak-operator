apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: takserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: takserver
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8089
        - port: 8443
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: takoperator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: takserver
      ports:
        - port: 47100
          endPort: 47110
        - port: 47500
          endPort: 47510
