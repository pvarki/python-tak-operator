apiVersion: v1
kind: Service
metadata:
  name: takserver
spec:
  selector:
    app.kubernetes.io/name: takserver
    app.kubernetes.io/component: api
  ports:
  - name: https
    port: 8443
    targetPort: 8443
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: tak-messaging
spec:
  selector:
    app.kubernetes.io/name: takserver
    app.kubernetes.io/component: messaging
  ports:
  - name: cot
    port: 8089
    targetPort: 8089
---
apiVersion: v1
kind: Service
metadata:
  name: tak-ignite
spec:
  selector:
    app.kubernetes.io/name: takserver
    app.kubernetes.io/component: messaging
  ports:
  - name: ignite-discovery
    port: 47500
    targetPort: 47500
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tak-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tak-config
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: takserver
      app.kubernetes.io/component: config
  template:
    metadata:
      labels:
        app.kubernetes.io/name: takserver
        app.kubernetes.io/component: config
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: config
        image: ghcr.io/pvarki/tak-server:5.8.69-260913-slimignite-pr136@sha256:5d250adfdb835e9bfafcce294736041d4fbd32c1ffde7b803f17e28bf2f85a09
        args:
        - /opt/scripts/start-tak.sh
        - config
        envFrom:
        - configMapRef:
            name: tak-settings
        - secretRef:
            name: tak-secrets
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tak-database-app
              key: password
        - name: TAK_IGNITE_BIND_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        readinessProbe:
          exec:
            command:
            - /usr/bin/python3
            - /opt/scripts/healthcheck.py
            - config
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /opt/tak/data
        - name: java-defaults
          mountPath: /etc/default/takserver
          subPath: takserver
          readOnly: true
        - name: runtime
          mountPath: /opt/tak/runtime
        startupProbe:
          exec:
            command:
            - /usr/bin/python3
            - /opt/scripts/healthcheck.py
            - config
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tak-data
      - name: java-defaults
        configMap:
          name: tak-java-defaults
      - name: runtime
        emptyDir: {}
      initContainers:
      - name: initialize
        image: ghcr.io/pvarki/tak-server:5.8.69-260913-slimignite-pr136@sha256:5d250adfdb835e9bfafcce294736041d4fbd32c1ffde7b803f17e28bf2f85a09
        args:
        - /opt/scripts/firstrun.sh
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tak-database-app
              key: password
        envFrom:
        - configMapRef:
            name: tak-settings
        - secretRef:
            name: tak-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /opt/tak/data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tak-messaging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: takserver
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: takserver
        app.kubernetes.io/component: messaging
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: messaging
        image: ghcr.io/pvarki/tak-server:5.8.69-260913-slimignite-pr136@sha256:5d250adfdb835e9bfafcce294736041d4fbd32c1ffde7b803f17e28bf2f85a09
        args:
        - /opt/scripts/start-tak.sh
        - messaging
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tak-database-app
              key: password
        - name: TAK_IGNITE_BIND_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        envFrom:
        - configMapRef:
            name: tak-settings
        - secretRef:
            name: tak-secrets
        ports:
        - name: cot
          containerPort: 8089
        readinessProbe:
          exec:
            command:
            - /usr/bin/python3
            - /opt/scripts/healthcheck.py
            - messaging
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 1536Mi
        volumeMounts:
        - name: data
          mountPath: /opt/tak/data
        - name: java-defaults
          mountPath: /etc/default/takserver
          subPath: takserver
          readOnly: true
        - name: runtime
          mountPath: /opt/tak/runtime
        startupProbe:
          exec:
            command:
            - /usr/bin/python3
            - /opt/scripts/healthcheck.py
            - messaging
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tak-data
      - name: java-defaults
        configMap:
          name: tak-java-defaults
      - name: runtime
        emptyDir: {}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: takserver
                app.kubernetes.io/component: config
            topologyKey: kubernetes.io/hostname
---
