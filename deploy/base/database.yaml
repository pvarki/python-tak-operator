apiVersion: v1
kind: Service
metadata:
  name: tak-database
spec:
  selector:
    app.kubernetes.io/name: tak-database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tak-database
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tak-database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tak-database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tak-database
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: ghcr.io/pvarki/postgis-server:15.3.5-260524
          envFrom:
            - configMapRef:
                name: tak-settings
            - secretRef:
                name: tak-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tak-database
