apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tak-database
spec:
  bootstrap:
    initdb:
      # pg_restore creates the source extensions during the import.
      postInitApplicationSQL: null
      import:
        type: microservice
        databases: [cot]
        source:
          externalCluster: legacy
        postImportApplicationSQL:
          - CREATE EXTENSION IF NOT EXISTS pgcrypto;
  externalClusters:
    - name: legacy
      connectionParameters:
        host: tak-database
        user: martiuser
        dbname: cot
        sslmode: disable
      password:
        name: tak-database-app
        key: password
