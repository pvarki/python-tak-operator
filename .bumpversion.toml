[tool.bumpversion]
current_version = "0.1.0"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.rst"
search = "takoperator:{current_version}"
replace = "takoperator:{new_version}"

[[tool.bumpversion.files]]
filename = "src/takoperator/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "tests/test_takoperator.py"
search = '__version__ == "{current_version}"'
replace = '__version__ == "{new_version}"'
